version: "3.9"

services:

  db:
    image: postgres:15
    container_name: asm_db
    environment:
      POSTGRES_USER: asm
      POSTGRES_PASSWORD: asm123
      POSTGRES_DB: asm_db
    ports:
      - "5432:5432"
    volumes:
      - asm_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: asm_backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    container_name: asm_frontend
    ports:
      - "3000:3000"
volumes:
  asm_pgdata:

