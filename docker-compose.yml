services:
  db:
    image: postgres:15
    restart: unless-stopped
    container_name: asm_db

    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}

    volumes:
      - asm_pgdata:/var/lib/postgresql/data
      - ./backend/asm_schema_post_guardrails-schema-only.sql:/docker-entrypoint-initdb.d/001-asip-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mcp:
    image: asip-mcp:7522aaafe06f67a3c3985e695d0dde59703babe4
    build: ./backend
    container_name: asm_mcp
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8666:8000"

    command: uvicorn mcp_server:app --host 0.0.0.0 --port 8000

    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

  backend:
    # Production backend releases are built from committed source and promoted
    # by updating this exact image reference. Do not add an implicit build here.
    image: asip-backend:sr-be-07e-04-d-52e4782-20261114T133344Z
    pull_policy: never
    container_name: asm_backend

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8555:8000"

    restart: unless-stopped

    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/seeds.txt:/app/seeds.txt:ro

    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:11434/api/generate}
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      CERTSPOTTER_API_KEY: ${CERTSPOTTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CENSYS_API_ID: ${CENSYS_API_ID:-}
      CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
      ASIP_DEFAULT_SCAN_OPERATIONS: HTTP_TLS_OBSERVATION,TECHNOLOGY_HTTP,PORT_SCAN
      ASIP_NMAP_WORKERS: "2"
      ASIP_HTTP_WORKERS: "2"
      ASIP_SAN_WORKERS: "2"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: asip-frontend:sr-ui-07e-03-064e551-20261114T120544Z
    pull_policy: never
    build: ./frontend
    container_name: asm_frontend

    ports:
      - "3555:3000"

    restart: unless-stopped

    depends_on:
      - backend

volumes:
  asm_pgdata:
