version: "3.9"

services:

  db:
    image: postgres:15
    restart: unless-stopped
    container_name: asm_db
    environment:
      POSTGRES_USER: asm
      POSTGRES_PASSWORD: asm123
      POSTGRES_DB: asm_db
    volumes:
      - asm_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: asm_backend
    depends_on:
      - db
    ports:
      - "8555:8000"
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://asm:asm123@db:5432/asm_db

  frontend:
    build: ./frontend
    container_name: asm_frontend
    ports:
      - "3555:3000"
    restart: unless-stopped
volumes:
  asm_pgdata:

